-anchor="end" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#BD7A2C" stroke="#E9E7DD" stroke-width="4" paint-order="stroke" stroke-linejoin="round">folytonosság</text><path d="M138.0,464.6 Q261.0,520.6 384.0,472.3" fill="none" stroke="#2E6E5E" stroke-width="3.2" stroke-linecap="round" marker-end="url(#f2tm)"/><text x="245" y="540" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" font-style="italic" fill="#2E6E5E" stroke="#E9E7DD" stroke-width="4" paint-order="stroke" stroke-linejoin="round">a forrás</text><text x="245" y="556" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" font-style="italic" fill="#2E6E5E" stroke="#E9E7DD" stroke-width="4" paint-order="stroke" stroke-linejoin="round">táplálja az Ént</text><line x1="170" y1="965" x2="220" y2="965" stroke="#BD7A2C" stroke-width="3" marker-end="url(#f2am)"/><text x="232" y="970" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#1F2E27">belülről árad, nem kívülről jön – egy energia öt arca</text><path d="M170,1003 Q200,987 220,1001" fill="none" stroke="#2E6E5E" stroke-width="3" marker-end="url(#f2tm)"/><text x="232" y="1005" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#1F2E27">visszatérés: a forrásból merített erő az Énbe ér</text><text x="450" y="1050" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#5C665F">Ez a mi átfordításunk, nem Mollison állítása: az ember nem kert, és a párhuzam ott ér véget, ahol megtörik.</text>
<text x="450" y="1068" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#5C665F">Illusztráció · Helyi Harmónia · „Felismerni, nem kitalálni.”</text></svg>
