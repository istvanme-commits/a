<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1090" role="img" aria-labelledby="f2t f2d">
<title id="f2t">Az élet geometriája – A mi átfordításunk</title>
<desc id="f2d">Hat körgyűrű az Éntől a forrásig (Z0–Z5). A középpontból öt sugár árad kifelé: önszeretet, önbizalom, figyelem, bőség, folytonosság. A forrástól egy ív vezet vissza az Énhez.</desc>
